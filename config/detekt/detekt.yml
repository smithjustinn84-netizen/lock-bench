# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Formatting is ktlint's job (Spotless); detekt covers code smells.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
    # A flat `when` over every event or sound is a lookup table, not branching logic.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # Count a class's own public surface: private helpers and interface overrides are free.
    ignorePrivate: true
    ignoreOverridden: true

style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    # Guard-clause early returns are the house style in the lock mechanics.
    max: 4
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
